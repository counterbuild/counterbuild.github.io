# Once a day, pull the latest heroes and items from deadlock-api.com. If anything changed, commit
# site/data.js and redeploy the site. A new hero also opens an issue listing what the site guessed
# about their kit, so it can be checked and added to the hand-written lists in site/knowledge.js.
name: Update hero and item data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the latest data
        run: |
          python tools/hero_report.py names > "$RUNNER_TEMP/before.txt"
          python tools/update_data.py
          python tools/hero_report.py report "$RUNNER_TEMP/before.txt" > "$RUNNER_TEMP/new-heroes.md"

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet site/data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js
          git commit -m "Update hero and item data from deadlock-api.com"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token don't start other workflows, so start the deploy here.
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open an issue for new heroes
        if: steps.commit.outputs.changed == 'true'
        run: |
          [ -s "$RUNNER_TEMP/new-heroes.md" ] || exit 0
          names=$(grep '^### ' "$RUNNER_TEMP/new-heroes.md" | sed 's/^### //' | paste -sd ',' - | sed 's/,/, /g')
          {
            echo "New on CounterBuild: **$names**. They're live on the site already, using kit facts guessed from the ability data:"
            echo
            cat "$RUNNER_TEMP/new-heroes.md"
            echo "To review, add each hero to the lists in \`site/knowledge.js\`: \`HERO_IMBUE\` (always), \`HERO_CC\`, \`HERO_MOBILITY\`, \`HERO_TRAITS.heal\` and \`SUPPORT_HEROES\` where they apply. Once a hero is in \`HERO_IMBUE\`, the hand-written lists replace the guesses."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "New hero: $names" --body-file "$RUNNER_TEMP/issue.md"
        env:
          GH_TOKEN: ${{ github.token }}
